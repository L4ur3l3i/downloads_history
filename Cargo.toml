[package]
name = "downloads_history"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
filetime = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }